# Switch between LOCAL and ATLAS by commenting/uncommenting ONE uri line.
# Do not enable both at the same time.
# -----------------------------------------------------------------------------

# Set MONGODB_URI to the Atlas connection string before starting the API (or defaults to Atlas Cloud).
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://theekshanagamage056_db_user:7LeBJce8mkUBvQg6@cluster0.gg26fnz.mongodb.net/biblione_db?retryWrites=true&w=majority}
spring.data.mongodb.database=${MONGODB_DATABASE:biblione_db}
spring.data.mongodb.auto-index-creation=true

# Example Atlas URI (set via environment variable instead of storing credentials here):
# MONGODB_URI=mongodb+srv://<username>:<password>@cluster0.gg26fnz.mongodb.net/biblione_db?retryWrites=true&w=majority

# Seed sample catalog / bookings on startup (set false after first successful run if desired)
biblione.seed=true

# Development seed accounts share this password; override before exposing the API.
biblione.seed-password=${BIBLIONE_SEED_PASSWORD:Biblione-ChangeMe-2026}

# CORS for the Flutter app (Chrome / Windows / Android emulator)
biblione.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:8080
